name: Build exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build launcher
        run: pyinstaller --onefile --console --clean --name "GSVI-Adapter" gsvi_launcher.py

      - name: Rename with tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Move-Item "dist/GSVI-Adapter.exe" "dist/GSVI-Adapter-$tag.exe"
          Get-ChildItem dist

      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GSVI-Adapter-*.exe
          generate_release_notes: true
